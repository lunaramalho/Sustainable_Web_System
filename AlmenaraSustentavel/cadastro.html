<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Almenara Sustentável</title>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SIDEBAR MODERNA -->
<div class="sidebar" id="sidebar">

  <div class="logo">
    <span>Menu</span>
  </div>

  <nav class="menu">
    <a href="index.html">🏠 <span>Início</span></a>
    <a href="cadastro.html" class="active">👤 <span>Cadastro</span></a>
    <a href="pontos.html">♻️ <span>Coleta</span></a>
    <a href="educacao.html">📚 <span>Educação</span></a>
    <a href="contato.html">📞 <span>Contato</span></a>
  </nav>

</div>

<!-- HEADER -->
<div class="header">

  <div class="d-flex align-items-center gap-3">
    
    <!-- BOTÃO MOBILE -->
    <button class="btn btn-success d-md-none" onclick="toggleMenu()">☰</button>

    <img src="imagens/bandeiraAlmenara.png" width="45">
    <h2 class="mb-0 titulo-app">Almenara Sustentável</h2>
  </div>

  <img src="imagens/simboloReciclagem.png" width="40">

</div>

<!-- CONTENT -->
<div class="content">

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card-custom">

        <!-- TABS -->
        <ul class="nav nav-tabs mb-4">
          <li class="nav-item">
            <button class="nav-link active" id="tabLogin" onclick="mostrarLogin()">Login</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tabCadastro" onclick="mostrarCadastro()">Cadastro</button>
          </li>
        </ul>

        <!-- LOGIN -->
        <div id="login">

          <h4 class="mb-3 fw-bold text-success">Entrar no sistema</h4>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Digite seu email">
          </div>

          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" placeholder="Digite sua senha">
          </div>

          <button class="btn btn-custom w-100">Entrar</button>

          <p class="mt-3 text-center">
            Não tem conta?
            <a href="#" onclick="mostrarCadastro()">Cadastre-se</a>
          </p>

        </div>

        <!-- CADASTRO -->
        <div id="cadastro" style="display:none;">

          <h4 class="mb-3 fw-bold text-success">Criar conta</h4>

          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" placeholder="Seu nome completo">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Seu email">
          </div>

          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" placeholder="(00) 00000-0000">
          </div>

          <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="text" class="form-control" placeholder="Rua, número, bairro">
          </div>

          <button class="btn btn-custom w-100">Cadastrar</button>

          <p class="mt-3 text-center">
            Já tem conta?
            <a href="#" onclick="mostrarLogin()">Fazer login</a>
          </p>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- SCRIPT -->
<script>
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("active");
}

function mostrarCadastro() {
  document.getElementById("login").style.display = "none";
  document.getElementById("cadastro").style.display = "block";

  document.getElementById("tabCadastro").classList.add("active");
  document.getElementById("tabLogin").classList.remove("active");
}

function mostrarLogin() {
  document.getElementById("login").style.display = "block";
  document.getElementById("cadastro").style.display = "none";

  document.getElementById("tabLogin").classList.add("active");
  document.getElementById("tabCadastro").classList.remove("active");
}
</script>

</body>
</html>
