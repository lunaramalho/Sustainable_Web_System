<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Almenara Sustentável</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="sidebar" id="sidebar">
  <div class="logo"><span>Menu</span></div>
  <nav class="menu">
    <a href="index.html">🏠 <span>Início</span></a>
    <a href="cadastro.html" class="active">👤 <span>Cadastro</span></a>
    <a href="pontos.html">♻️ <span>Coleta</span></a>
    <a href="educacao.html">📚 <span>Educação</span></a>
    <a href="contato.html">📞 <span>Contato</span></a>
  </nav>
</div>

<div class="header">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-success d-md-none" onclick="toggleMenu()">☰</button>
    <img src="imagens/bandeiraAlmenara.png" width="45">
    <h2 class="mb-0 titulo-app">Almenara Sustentável</h2>
  </div>
  <img src="imagens/simboloReciclagem.png" width="40">
</div>

<div class="content">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card-custom">

        <ul class="nav nav-tabs mb-4">
          <li class="nav-item">
            <button class="nav-link active" id="tabLogin" onclick="mostrarLogin()">Login</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="tabCadastro" onclick="mostrarCadastro()">Cadastro</button>
          </li>
        </ul>

        <div id="login">
          <h4 class="mb-3 fw-bold text-success">Entrar no sistema</h4>
          
          <form id="formLogin">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="emailLogin" name="email" class="form-control" placeholder="Digite seu email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" id="senhaLogin" name="senha" class="form-control" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-custom w-100">Entrar</button>
          </form>
          
          <p class="mt-3 text-center">Não tem conta? <a href="#" onclick="mostrarCadastro()">Cadastre-se</a></p>
        </div>

        <div id="cadastro" style="display:none;">
          <h4 class="mb-3 fw-bold text-success">Criar conta</h4>
          <form action="/cadastrar" method="POST">
            <div class="mb-3">
              <label class="form-label">Nome</label>
              <input type="text" name="nome" class="form-control" placeholder="Seu nome completo" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" placeholder="Seu email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" name="senha" class="form-control" placeholder="Crie uma senha" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Telefone</label>
              <input type="text" name="telefone" class="form-control" placeholder="(00) 00000-0000">
            </div>
            <div class="mb-3">
              <label class="form-label">Endereço</label>
              <input type="text" name="endereco" class="form-control" placeholder="Rua, número, bairro">
            </div>
            <button type="submit" class="btn btn-custom w-100">Cadastrar</button>
          </form>
          <p class="mt-3 text-center">Já tem conta? <a href="#" onclick="mostrarLogin()">Fazer login</a></p>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
function toggleMenu() { document.getElementById("sidebar").classList.toggle("active"); }

function mostrarCadastro() {
  document.getElementById("login").style.display = "none";
  document.getElementById("cadastro").style.display = "block";
  document.getElementById("tabCadastro").classList.add("active");
  document.getElementById("tabLogin").classList.remove("active");
}

function mostrarLogin() {
  document.getElementById("login").style.display = "block";
  document.getElementById("cadastro").style.display = "none";
  document.getElementById("tabLogin").classList.add("active");
  document.getElementById("tabCadastro").classList.remove("active");
}

// --- LÓGICA DE COMUNICAÇÃO COM O LARAVEL ---
const formLogin = document.getElementById('formLogin');

formLogin.addEventListener('submit', async function(evento) {
    evento.preventDefault(); 

    const emailDigitado = document.getElementById('emailLogin').value;
    const senhaDigitada = document.getElementById('senhaLogin').value;

    try {
        const resposta = await fetch('http://127.0.0.1:8000/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ 
                email: emailDigitado, 
                password: senhaDigitada 
            }) 
        });

        const dados = await resposta.json();

        // Se o login for bem-sucedido
        if (resposta.ok) {
            // Salva os dados do usuário no localStorage
            localStorage.setItem('usuarioLogado', JSON.stringify(dados.usuario));
            
            // Redireciona a página para o perfil
            window.location.href = 'perfil.html';
        } else {
            alert("Erro: " + dados.mensagem); 
        }

    } catch (erro) {
        alert("Erro de conexão. Certifique-se de que o comando 'php artisan serve' está rodando no Laravel.");
        console.error(erro);
    }
});
</script>
</body>
</html>
